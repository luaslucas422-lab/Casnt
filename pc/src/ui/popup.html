<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { background: transparent !important; overflow: hidden; }
    .pop { position: absolute; inset: 8px; background: var(--panel); border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 7px 0 #000; padding: 18px 20px; animation: pop .25s ease-out; }
    .top { display: flex; gap: 12px; align-items: center; }
    .top img { width: 46px; height: 46px; }
    body.plain .pop { border-width: 1px; box-shadow: none; }
  </style>
</head>
<body>
  <div class="pop">
    <div class="top"><img src="../../build/icon.png" alt=""><span class="wordmark" style="font-size:26px">Casnt</span></div>
    <p id="msg" style="font-size:17px;font-weight:700;margin:12px 0 4px"></p>
    <p class="hint" id="mode" style="margin:0 0 14px"></p>
    <div class="row">
      <button class="btn" id="yes">Accept</button>
      <button class="btn dark" id="no">Decline</button>
      <span class="hint" id="left"></span>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('cartoon') === 'false') document.body.classList.add('plain', 'theme-dark');
  document.getElementById('msg').textContent = `${q.get('model') || 'Your Quest'} (${q.get('name') || 'Quest'}) is trying to cast to you. Do you accept?`;
  document.getElementById('mode').textContent = q.get('mode') === 'app' ? 'They want to share just one app.' : 'They want to share everything they see.';
  document.getElementById('yes').onclick = () => window.casnt.respondCast(true);
  document.getElementById('no').onclick = () => window.casnt.respondCast(false);
  let left = Number(q.get('timeout') || 60);
  const tick = () => { document.getElementById('left').textContent = `Auto-declines in ${left}s`; left = Math.max(0, left - 1); };
  tick(); setInterval(tick, 1000);
  if (q.get('sounds') !== 'false') {
    try {
      const a = new AudioContext();
      [880, 1175].forEach((f, i) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.15, a.currentTime + i * 0.13);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i * 0.13 + 0.18);
        o.connect(g).connect(a.destination); o.start(a.currentTime + i * 0.13); o.stop(a.currentTime + i * 0.13 + 0.2);
      });
    } catch (_) {}
  }
</script>
</body>
</html>
